[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightforge"
version = "0.1.0"
description = "A reusable Python analytics toolkit for economic and data analysis."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9"
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "3sha08", email = "td8m28@gmail.com" }
]
[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.13",
    "build>=1.2",
    "twine>=6.0"
]
[tool.pytest.ini_options]
addopts = "--cov=insightforge --cov-report=term-missing --cov-fail-under=100"